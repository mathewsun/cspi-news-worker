name: RSS worker validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Cspi.NewsCollector.csproj
      - run: dotnet build Cspi.NewsCollector.csproj -c Release --no-restore --warnaserror
